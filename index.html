<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games Launcher</title>
    <style>
      :root {
        --bg: #0b1020;
        --bg-2: #131d33;
        --panel: rgba(16, 22, 38, 0.82);
        --panel-strong: rgba(25, 34, 58, 0.96);
        --card: rgba(255, 255, 255, 0.05);
        --card-border: rgba(255, 255, 255, 0.11);
        --text: #edf3ff;
        --muted: #a6b4d9;
        --accent: #7aa2ff;
        --accent-2: #9d7bff;
        --ok: #47d97b;
        --err: #ff7a7a;
        --shadow: rgba(0, 0, 0, 0.38);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(1200px 900px at 10% -10%, rgba(118, 124, 255, 0.25), transparent 45%),
                    radial-gradient(1000px 700px at 110% 10%, rgba(160, 91, 255, 0.2), transparent 50%),
                    linear-gradient(160deg, var(--bg), var(--bg-2));
        color: var(--text);
      }

      body {
        padding: 28px 18px 42px;
      }

      .app {
        width: min(1100px, 100%);
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        flex-wrap: wrap;
        margin-bottom: 22px;
      }

      .title-wrap {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .logo {
        width: 50px;
        height: 50px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 16px 28px rgba(122, 162, 255, 0.42);
      }

      .logo svg {
        width: 28px;
        height: 28px;
        stroke: #fff;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 2.6rem);
        letter-spacing: -0.05em;
      }

      .subtitle {
        margin: 6px 0 0;
        color: var(--muted);
      }

      .count-badge {
        border: 1px solid var(--card-border);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--muted);
        padding: 10px 14px;
        font-weight: 600;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--card-border);
        border-radius: 22px;
        box-shadow: 0 25px 60px var(--shadow);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }

      .controls {
        padding: 18px 18px 0;
      }

      .search-wrap {
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--card-border);
        border-radius: 14px;
        padding: 12px 14px;
      }

      .search-wrap svg {
        flex-shrink: 0;
        width: 18px;
        height: 18px;
        stroke: var(--muted);
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .search-wrap input {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 1rem;
      }

      .search-wrap input::placeholder {
        color: var(--muted);
      }

      .status {
        min-height: 24px;
        margin: 16px 18px 0;
        color: var(--muted);
        font-size: 0.96rem;
      }

      .status.ok { color: var(--ok); }
      .status.err { color: var(--err); }

      .list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 14px;
        padding: 18px;
      }

      .game-card {
        appearance: none;
        border: 1px solid var(--card-border);
        background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
        border-radius: 16px;
        padding: 16px 14px 14px;
        color: var(--text);
        text-align: left;
        cursor: pointer;
        transition: transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
      }

      .game-card:hover {
        transform: translateY(-1px);
        border-color: rgba(122, 162, 255, 0.7);
        box-shadow: 0 12px 26px rgba(32, 48, 86, 0.45);
      }

      .game-card .icon {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: linear-gradient(135deg, rgba(122, 162, 255, 0.18), rgba(157, 123, 255, 0.2));
        color: #dfe9ff;
        font-weight: 700;
        margin-bottom: 12px;
      }

      .game-card .game-name {
        font-size: 1.05rem;
        font-weight: 700;
        line-height: 1.35;
        margin: 0;
      }

      .game-card .game-meta {
        margin-top: 8px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .empty {
        display: none;
        padding: 26px 18px 28px;
        color: var(--muted);
      }

      .empty.visible {
        display: block;
      }

      .preview-host {
        margin-top: 16px;
        padding: 0 18px 18px;
        display: none;
      }

      .preview-host.show {
        display: block;
      }

      .preview-host iframe {
        width: 100%;
        min-height: 420px;
        border: 1px solid var(--card-border);
        border-radius: 14px;
        background: #fff;
      }

      .mini-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 0.82rem;
      }

      button.secondary {
        border: 1px solid var(--card-border);
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
        border-radius: 10px;
        padding: 8px 10px;
        cursor: pointer;
        font: inherit;
      }

      @media (max-width: 620px) {
        body { padding-left: 12px; padding-right: 12px; }
        .topbar { align-items: flex-start; }
        .controls, .list, .status, .preview-host { padding-left: 12px; padding-right: 12px; }
        .list { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="title-wrap">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <polygon points="6,5 18,5 20,9 20,19 4,19 4,9"></polygon>
              <path d="M8 9h8M8 13h8M10 5V3M14 5V3"></path>
            </svg>
          </div>
          <div>
            <h1>Games Launcher</h1>
            <p class="subtitle">Open a HTML game in a new about:blank window.</p>
          </div>
        </div>
        <div id="countBadge" class="count-badge">0 games</div>
      </header>

      <section class="panel">
        <div class="controls">
          <label class="search-wrap" aria-label="Search games">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="6"></circle>
              <path d="M16 16L21 21"></path>
            </svg>
            <input id="searchInput" type="search" placeholder="Search game titles..." autocomplete="off" />
          </label>
        </div>

        <div id="status" class="status" aria-live="polite"></div>

        <div id="gameList" class="list" aria-live="polite"></div>
        <div id="emptyState" class="empty">No games match your search.</div>

        <div id="previewHost" class="preview-host">
          <div class="mini-actions">
            <span>Popup blocked — showing fallback preview</span>
            <button id="closePreview" class="secondary" type="button">Close</button>
          </div>
          <iframe id="previewFrame" title="Game preview" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
        </div>
      </section>
    </main>

    <script>
      (function () {
        "use strict";

        const owner = "Inky-Puma";
        const repo = "Games";
        const branch = "main";
        const apiUrl = "https://api.github.com/repos/" + owner + "/" + repo + "/contents?ref=" + branch;

        const state = {
          games: [],
          lastOpenedName: ""
        };

        const searchInput = document.getElementById("searchInput");
        const statusEl = document.getElementById("status");
        const listEl = document.getElementById("gameList");
        const countBadge = document.getElementById("countBadge");
        const emptyState = document.getElementById("emptyState");
        const previewHost = document.getElementById("previewHost");
        const previewFrame = document.getElementById("previewFrame");
        const closePreviewBtn = document.getElementById("closePreview");

        function setStatus(message, type) {
          statusEl.textContent = message || "";
          statusEl.className = "status" + (type ? " " + type : "");
        }

        function safeTitle(value) {
          return String(value || "game").replace(/[<>"'&]/g, function (ch) {
            return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[ch];
          });
        }

        function filterGames(query) {
          const q = (query || "").trim().toLowerCase();
          if (!q) return state.games;
          return state.games.filter(function (game) {
            return game.name.toLowerCase().includes(q);
          });
        }

        function renderList(query) {
          const filtered = filterGames(query);
          listEl.innerHTML = "";

          if (!filtered.length) {
            emptyState.classList.add("visible");
          } else {
            emptyState.classList.remove("visible");
          }

          countBadge.textContent = filtered.length + " game" + (filtered.length === 1 ? "" : "s");

          filtered.forEach(function (game) {
            const card = document.createElement("button");
            card.type = "button";
            card.className = "game-card";
            card.setAttribute("aria-label", "Open " + game.name);
            card.innerHTML = [
              '<div class="icon">' + safeTitle(game.name.slice(0, 2).toUpperCase() || "G") + '</div>',
              '<p class="game-name">' + safeTitle(game.name) + '</p>',
              '<div class="game-meta"><span>HTML</span><span>•</span><span>Open in about:blank</span></div>'
            ].join("");

            card.addEventListener("click", function () {
              launchGame(game);
            });

            listEl.appendChild(card);
          });
        }

        function openBlankWindow(name) {
          let win = null;
          try {
            win = window.open("about:blank", "_blank");
          } catch (error) {
            win = null;
          }

          if (!win || win.closed || typeof win.document === "undefined") {
            return null;
          }

          try {
            win.document.open();
            win.document.write(
              "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>Loading…</title>" +
              "<style>body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1020;color:#edf3ff;font-family:system-ui,sans-serif}p{font-size:16px;opacity:.85}</style></head>" +
              "<body><p>Loading " + safeTitle(name || "game") + "…</p></body></html>"
            );
            win.document.close();
          } catch (error) {
            // ignore; we will write the real content after the fetch completes.
          }

          return win;
        }

        function renderPreviewFallback(html, name) {
          previewFrame.srcdoc = html;
          previewHost.classList.add("show");
          setStatus('Popup blocked. Showing the game preview below for "' + name + '".', "err");
        }

        function launchGame(game) {
          const name = game.name || "game.html";
          const blank = openBlankWindow(name);

          if (!blank) {
            setStatus("Popup blocked. Please allow popups for this site, or click a game again after enabling them.", "err");
            return;
          }

          setStatus("Loading \"" + name + "\" into a blank tab…", "");

          fetch(game.download_url || game.url)
            .then(function (response) {
              if (!response.ok) {
                throw new Error("Fetch failed with status " + response.status);
              }
              return response.text();
            })
            .then(function (html) {
              try {
                blank.document.open();
                blank.document.write(html);
                blank.document.close();
                blank.focus();
                state.lastOpenedName = name;
                setStatus("Opened \"" + name + "\" in about:blank.", "ok");
              } catch (error) {
                renderPreviewFallback(html, name);
              }
            })
            .catch(function (error) {
              try {
                blank.document.open();
                blank.document.write(
                  "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>Error</title><style>body{font-family:system-ui,sans-serif;background:#0b1020;color:#fff;padding:2rem}</style></head><body><h2>Unable to load game</h2><p>" +
                  safeTitle(name) + " could not be fetched.</p></body></html>"
                );
                blank.document.close();
              } catch (innerError) {}

              setStatus("Could not load \"" + name + "\". Please try again.", "err");
            });
        }

        function loadGames() {
          setStatus("Loading games list…", "");

          fetch(apiUrl, {
            headers: {
              Accept: "application/vnd.github+json"
            }
          })
            .then(function (response) {
              if (!response.ok) {
                throw new Error("GitHub API request failed: " + response.status);
              }
              return response.json();
            })
            .then(function (items) {
              if (!Array.isArray(items)) {
                throw new Error("Unexpected GitHub API result");
              }

              state.games = items
                .filter(function (item) {
                  return item && item.type === "file" && /\.html?$/i.test(item.name);
                })
                .sort(function (a, b) {
                  return a.name.localeCompare(b.name, undefined, { sensitivity: "base" });
                });

              renderList(searchInput.value);
              setStatus("Loaded " + state.games.length + " HTML game files.", "ok");
            })
            .catch(function (error) {
              console.error(error);
              setStatus("Could not load the game list from GitHub. Please refresh the page.", "err");
            });
        }

        searchInput.addEventListener("input", function () {
          renderList(searchInput.value);
        });

        closePreviewBtn.addEventListener("click", function () {
          previewFrame.srcdoc = "";
          previewHost.classList.remove("show");
          setStatus("Preview closed.", "");
        });

        loadGames();
      })();
    </script>
  </body>
</html>
